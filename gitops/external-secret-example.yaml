# Production pattern for the `existingSecret: sample-app-secrets` referenced
# in helm values.yaml. Real secret material NEVER goes in git (unlike the
# original repo's secret.yaml / hardcoded Twitter keys in deployment.yaml).
#
# This uses External Secrets Operator (ESO) to pull from AWS Secrets Manager
# and materialize a native Kubernetes Secret that the Deployment consumes.
# Swap the `secretStoreRef`/backend for Vault, GCP Secret Manager, etc. --
# the ExternalSecret shape stays the same.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: sample-app
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: sample-app   # IRSA-annotated ServiceAccount, no static AWS keys in-cluster
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sample-app-secrets
  namespace: sample-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: sample-app-secrets      # <- this is the Secret name the Deployment reads
    creationPolicy: Owner
  data:
    - secretKey: CONSUMER_KEY
      remoteRef: { key: sample-app/twitter, property: consumer_key }
    - secretKey: CONSUMER_SECRET
      remoteRef: { key: sample-app/twitter, property: consumer_secret }
    - secretKey: ACCESS_TOKEN
      remoteRef: { key: sample-app/twitter, property: access_token }
    - secretKey: ACCESS_TOKEN_SECRET
      remoteRef: { key: sample-app/twitter, property: access_token_secret }
