name: CI - Test, Build, Scan, Tag, Push

# Trunk-based flow: every PR gets tested; only merges to main build & publish
# an image. Tags (vX.Y.Z) cut an immutable release image.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write        # push to GHCR
  security-events: write # upload Trivy SARIF to the Security tab
  id-token: write        # for keyless cosign signing (OIDC)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # -> ghcr.io/<owner>/<repo>

jobs:
  # -------------------------------------------------------------------------
  # 1. TEST — unit tests + coverage, fails the build on red tests
  # -------------------------------------------------------------------------
  test:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run unit tests
        run: mvn -B clean verify

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven Tests
          path: "target/surefire-reports/*.xml"
          reporter: java-junit

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  # -------------------------------------------------------------------------
  # 2. BUILD + TAG + SCAN + PUSH — only after tests pass, only on main/tag
  # -------------------------------------------------------------------------
  build-scan-push:
    name: Build, scan, tag, push image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives image tags: branch sha for main pushes, semver for git tags,
      # plus a rolling "latest". Never rely on ":latest" for deployments.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image (not yet pushed — scan first)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan BEFORE push. Fail the pipeline on HIGH/CRITICAL CVEs so a
      # vulnerable image never reaches the registry.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha

      # Keyless signing — proves the image came from THIS pipeline.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, OIDC)
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

  # -------------------------------------------------------------------------
  # 3. CD trigger (GitOps) — bump the image tag in the config repo; ArgoCD
  #    notices the git change and reconciles the cluster. The pipeline
  #    NEVER talks to the cluster directly.
  # -------------------------------------------------------------------------
  update-gitops:
    name: Update GitOps manifest
    needs: build-scan-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps config repo
        uses: actions/checkout@v4
        with:
          repository: Auduj01/RealTime-Project-06-gitops
          token: ${{ secrets.GITOPS_PAT }}

      - name: Bump image tag
        run: |
          NEW_TAG="sha-${{ github.sha }}"
          yq -i ".image.tag = \"${NEW_TAG}\"" apps/sample-app/values-prod.yaml

      - name: Commit and push
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add apps/sample-app/values-prod.yaml
          git commit -m "ci: deploy sample-app sha-${{ github.sha }}"
          git push
