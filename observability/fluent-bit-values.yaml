# helm install fluent-bit fluent/fluent-bit -n logging --create-namespace \
#   -f observability/fluent-bit-values.yaml
#
# Runs as a DaemonSet: one collector per node, tailing container stdout/stderr
# from /var/log/containers, enriching with pod metadata, shipping to your log
# backend (Loki here -- Loki + Grafana keeps the whole stack in one UI, but
# the same config pattern targets Elasticsearch/OpenSearch/CloudWatch/Datadog).

config:
  service: |
    [SERVICE]
        Flush        5
        Daemon       Off
        Log_Level    info
        Parsers_File parsers.conf

  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        multiline.parser  docker, cri
        Tag               kube.*
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

    # Drop noisy health-check access logs before they leave the node
    [FILTER]
        Name    grep
        Match   kube.*
        Exclude log actuator/health

  outputs: |
    [OUTPUT]
        Name        loki
        Match       kube.*
        Host        loki.logging.svc.cluster.local
        Port        3100
        Labels      job=fluent-bit, namespace=$kubernetes['namespace_name'], app=$kubernetes['labels']['app.kubernetes.io/name']
        Line_Format json

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 200m, memory: 128Mi }

tolerations:
  - operator: Exists   # run on every node, including tainted control-plane nodes
