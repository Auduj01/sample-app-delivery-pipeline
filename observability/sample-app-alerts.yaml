# Picked up automatically by the Prometheus Operator because of the
# `release: kube-prometheus-stack` label (same pattern as the ServiceMonitor).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sample-app-alerts
  namespace: sample-app
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: sample-app.rules
      rules:
        - alert: SampleAppDown
          expr: up{job="sample-app"} == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "sample-app target down"
            description: "Prometheus has not been able to scrape {{ $labels.instance }} for 2 minutes."

        - alert: SampleAppHighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{status=~"5..", job="sample-app"}[5m]))
            /
            sum(rate(http_server_requests_seconds_count{job="sample-app"}[5m])) > 0.05
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "sample-app 5xx rate above 5%"

        - alert: SampleAppPodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="sample-app"}[15m]) > 3
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Pod {{ $labels.pod }} restarting repeatedly"

        - alert: SampleAppHighMemory
          expr: |
            container_memory_working_set_bytes{namespace="sample-app"}
            / container_spec_memory_limit_bytes{namespace="sample-app"} > 0.9
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Pod {{ $labels.pod }} using >90% of its memory limit"
