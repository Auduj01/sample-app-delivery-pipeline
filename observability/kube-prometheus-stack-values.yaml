# helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f observability/kube-prometheus-stack-values.yaml
#
# This one chart installs Prometheus + Grafana + Alertmanager + the
# node/kube-state exporters -- the whole "meanwhile" box in the diagram,
# minus Fluent Bit (that's a separate chart, see fluent-bit-values.yaml).

prometheus:
  prometheusSpec:
    retention: 15d
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }
    # Only pick up ServiceMonitors created by app charts (like sample-app's)
    # instead of every ServiceMonitor cluster-wide -- keeps noisy neighbors out.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector:
      matchLabels:
        release: kube-prometheus-stack
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

grafana:
  adminPassword: "" # leave blank here; set via --set or an existingSecret in real use
  defaultDashboardsEnabled: true
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - grafana.mydomain.com
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.mydomain.com
  # Auto-import a JVM/Spring Boot dashboard on first boot
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      jvm-micrometer:
        gnetId: 4701
        revision: 10
        datasource: Prometheus

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: slack-notifications
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: slack-critical
          matchers:
            - severity="critical"
          continue: true
    receivers:
      - name: slack-notifications
        slack_configs:
          - api_url: "https://hooks.slack.com/services/REPLACE/ME"
            channel: "#platform-alerts"
            send_resolved: true
      - name: slack-critical
        slack_configs:
          - api_url: "https://hooks.slack.com/services/REPLACE/ME"
            channel: "#platform-pages"
            send_resolved: true
